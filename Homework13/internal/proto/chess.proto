// Версия синтаксиса .proto
// proto3 - самый актуальный
// Должен быть первой строкой
syntax = "proto3";

// package — логическое пространство имён для типов в этом файле.
// Защищает от конфликтов имён при нескольких .proto. НЕ связано с Go-пакетом.
package chess;

import "google/protobuf/empty.proto";

// option go_package — настройка для плагина protoc-gen-go.
// Формат: "<import_path>;<package_name>".
//   mod.go/internal/proto — путь для импорта из Go-кода.
//   pb — имя Go-пакета в сгенерированном файле.
option go_package = "mod.go/internal/proto;pb";

// ============ Общие типы ============

// enum - перечисление, аналог const-набора
// В proto3 первое значение ОБЯЗАТЕЛЬНО = 0, это значение по умолчанию.
// Служит для отличия «значение не задано» от «задано явно».
enum Color {
    COLOR_UNSPECIFIED = 0;
    WHITE = 1;
    BLACK = 2;
}

enum PieceType {
  PIECE_TYPE_UNSPECIFIED = 0;
  PAWN = 1;
  ROOK = 2;
  KNIGHT = 3;
  BISHOP = 4;
  QUEEN = 5;
  KING = 6;
}

// message — структура, аналог struct в Go.
// Каждое поле имеет уникальный номер, по нему поле передаётся
// по сети в бинарном виде. Номера нельзя переиспользовать.
message Piece {
  Color color = 1;
  PieceType type =2;
}

// optional — «поле может отсутствовать». В Go генерируется как указатель *T.
// Нужен, когда важно отличить «пусто» от «значение по умолчанию».
message Cell {
  optional Piece piece = 1;
}

// repeated — слайс/массив. В Go генерируется как []T. Может быть пустым.
message Row {
  repeated Cell cells = 1;
}

message Board {
  int32 rows = 1;
  int32 cols = 2;
  repeated Row grid = 3;
}

message Player {
  int32 id = 1;
  string name = 2;
}

message Move {
  int32 id = 1;
  int32 game_id = 2;
  int32 from_row = 3;
  int32 from_col = 4;
  int32 to_row = 5;
  int32 to_col = 6;
  optional Piece captured = 7;
  PieceType promotion = 8;
  optional Piece moved_piece = 9;
  bool check = 10;
  bool mate = 11;
}

message Game {
  int32 id = 1;
  Player player1 = 2;
  Player player2 = 3;
  Color player1_color = 4;
  Color player2_color = 5;
  Board board = 6;
  Color current = 7;
  repeated Move moves = 8;
}

// ============ PlayerService ============

// service — набор RPC-методов, объединённых по смыслу.
// protoc сгенерирует интерфейс сервера и клиента для этих методов.
service PlayerService {
  // rpc — удалённый вызов. unary = один запрос → один ответ.
  // Формат: rpc Имя(ВходнойТип) returns (ВыходнойТип);
  rpc CreatePlayer(CreatePlayerRequest) returns (Player);
  rpc GetPlayer(GetPlayerRequest) returns (Player);
  rpc ListPlayers(ListPlayersRequest) returns (ListPlayersResponse);
  rpc UpdatePlayer(UpdatePlayerRequest) returns (Player);
  rpc DeletePlayer(DeletePlayerRequest) returns (DeletePlayerResponse);
}

message CreatePlayerRequest {
  string name = 1;
}

message GetPlayerRequest {
  int32 id = 1;
}

message ListPlayersRequest {}

message ListPlayersResponse {
  repeated Player players = 1;
}

message UpdatePlayerRequest {
  int32 id = 1;
  string name = 2;
}

message DeletePlayerRequest {
  int32 id = 1;
}

message DeletePlayerResponse {}

// ============ GameService ============

service GameService {
  rpc CreateGame(CreateGameRequest) returns (Game);
  rpc GetGame(GetGameRequest) returns (Game);
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);
  rpc UpdateGame(UpdateGameRequest) returns (Game);
  rpc DeleteGame(DeleteGameRequest) returns (DeleteGameResponse);
  rpc MakeMove(MakeMoveRequest) returns (Game);
  rpc AutoMove(AutoMoveRequest) returns (Game);
}

message CreateGameRequest {
  string player1_name = 1;
  string player2_name = 2;
  int32 rows = 3;
  int32 cols = 4;
}

message GetGameRequest {
  int32 id = 1;
}

message ListGamesRequest {}

message ListGamesResponse {
  repeated Game games = 1;
}

message UpdateGameRequest {
  int32 id = 1;
  string player1_name = 2;
  string player2_name = 3;
}

message DeleteGameRequest {
  int32 id = 1;
}

message DeleteGameResponse {}

message MakeMoveRequest {
  int32 game_id = 1;
  int32 from_row = 2;
  int32 from_col = 3;
  int32 to_row = 4;
  int32 to_col = 5;
  PieceType promotion = 6;
}

message AutoMoveRequest {
  int32 game_id = 1;
}

// ============ MoveService ============

// Здесь используется google.protobuf.Empty вместо своих пустых сообщений:
// ListMoves — пустой запрос (нет параметров), DeleteMove — пустой ответ.
// В остальных сервисах для сравнения оставлены собственные пустые сообщения.
service MoveService {
  rpc CreateMove(CreateMoveRequest) returns (Move);
  rpc GetMove(GetMoveRequest) returns (Move);
  rpc ListMoves(google.protobuf.Empty) returns (ListMovesResponse);
  rpc UpdateMove(UpdateMoveRequest) returns (Move);
  rpc DeleteMove(DeleteMoveRequest) returns (google.protobuf.Empty);
}

message CreateMoveRequest {
  int32 game_id = 1;
  int32 from_row = 2;
  int32 from_col = 3;
  int32 to_row = 4;
  int32 to_col = 5;
  PieceType promotion = 6;
}

message GetMoveRequest {
  int32 id = 1;
}

message ListMovesResponse {
  repeated Move moves = 1;
}

message UpdateMoveRequest {
  int32 id = 1;
  int32 game_id = 2;
  int32 from_row = 3;
  int32 from_col = 4;
  int32 to_row = 5;
  int32 to_col = 6;
}

message DeleteMoveRequest {
  int32 id = 1;
}